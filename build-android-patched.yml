name: Build Eden Android (patched)

# Run manually from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch file inside the patches/ folder"
        default: "eden-leak-perf-thermal-fpslimit-v8.patch"
        required: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: |
          git apply --check "patches/${{ github.event.inputs.patch }}"
          git apply "patches/${{ github.event.inputs.patch }}"
          git --no-pager diff --stat

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle and CPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/cpm
          key: eden-android-${{ hashFiles('src/android/**/*.gradle.kts', 'cpmfile.json', '**/cpmfile.json') }}
          restore-keys: eden-android-

      - name: Build APK
        run: |
          chmod +x .ci/android/build.sh
          # -DYUZU_DOWNLOAD_ANDROID_VVL=OFF leaves out the 24 MB Vulkan validation layer.
          .ci/android/build.sh -t standard -b Release -DYUZU_DOWNLOAD_ANDROID_VVL=OFF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-patched
          path: |
            artifacts/*.apk
          if-no-files-found: error
